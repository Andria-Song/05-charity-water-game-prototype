<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charity Water Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- images of jerry cans -->
  <div class="jerry-can-container">
    <img id="jerry-can-half" src="img/jerry can half.png" alt="Jerry Can Half filled with water" class="jerry-can" style="display: none;">
    <img id="jerry-can-empty" src="img/jerry can empty.png" alt="Empty Jerry Can" class="jerry-can">
    <img id="jerry-can-quarter" src="img/jerry can quarter.png" alt="Jerry Can Quarter filled with water" class="jerry-can" style="display: none;">
    <img id="jerry-can-three-quarter" src="img/jerry can three quart.png" alt="Jerry Can filled three Quarters" class="jerry-can" style="display: none;">
    <img id="jerry-can-full" src="img/jerry can full.png" alt="Jerry Can Quarter completely filled" class="jerry-can" style="display: none;">
  </div>

  <!-- Fill Button-->
  <button id="fill-button">FILL</button>

  <div id="top-hud">
    <!-- Score Display -->
    <div id="score">Score: 0</div>
    <div id="goal">Goal: 7</div>

    <!-- Timer and Pause Controls -->
    <div id="center-controls">
      <div id="timer">30</div>
      <button id="pause-button">II</button>
      <div class="timing-bar">
        <div class="progress-ticker"></div>
      </div>
    </div>
  </div>

  <div id= "start-screen" style="display: none;">
    <h1>Fill the Can</h1>
    <p>Help charity: water provide clean drinking water by filling as much jerry cans as you can before time runs out!</p>
    <h2>Select Difficulty</h2>
    <div id="difficulty-controls" aria-label="Difficulty Level">
        <button class="difficulty-button" data-level="easy">Easy</button>
        <button class="difficulty-button is-active" data-level="medium">Medium</button>
        <button class="difficulty-button" data-level="hard">Hard</button>
      </div>
    <button id="start-button">Start Game</button>
    <a id="logo-button" href="https://www.charitywater.org/" target="_blank" rel="noopener noreferrer">
      <img id="logo" src="img/water-can.png" alt="charity water logo">
    </a>
  </div>

  <!-- Game Over Message -->
  <div id="game-over" style="display: none;">
    <h2>Game Over!</h2>
    <div id="number">
      <p>You filled<br><span id="final-score">0</span><br>jerry cans!</p>
    </div>
    <div id="message">
      <p>Play again or learn more about the importance of clean water!</p>
    </div>
    <button id="restart-button">Play Again</button>
    <a id="donate-button" href="https://www.charitywater.org/donate/the-spring" target="_blank" rel="noopener noreferrer">Donate</a>
    <a id="learn-button" href="https://www.charitywater.org/our-work" target="_blank" rel="noopener noreferrer">Learn More</a>
    <button id="home-button">Home</button>
  </div>



  <script src="script.js"></script>
</body>
</html>
